image: python:3.12

stages:
  - lint
  - security
  - test
  - build

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Run for merge requests and pushes to long-lived branches. These rules prevent
# duplicate pipelines for an open merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - when: never

lint:
  stage: lint
  script:
    - pip install ruff==0.8.4 "black==24.10.0"
    - bash shell/lint.sh

sast:
  stage: security

secret_detection:
  stage: security

audit:
  stage: security
  script:
    - pip install pip-audit==2.7.3
    - pip-audit -r requirements-api.txt
    - pip-audit -r requirements-dev.txt

test:
  stage: test
  script:
    - pip install -r requirements-api.txt -r requirements-dev.txt
    - python -m compileall backend/masking_service
    - pytest --cov=masking_service --cov-report=term --durations=20
  coverage: '/TOTAL.*\s+(\d+%)$/'

# Publish one immutable image per release (contract v1.2 section 10). The build
# stamps the release and the commit into the image, and records the digest that
# MLOps deploys and passes back as IMAGE_DIGEST.
build-image:
  stage: build
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_NAME: "$CI_REGISTRY_IMAGE/masking-api"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false
  script:
    - export SERVICE_RELEASE="${CI_COMMIT_TAG:-0.0.0-$CI_COMMIT_SHORT_SHA}"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --target api
        --build-arg SERVICE_RELEASE="$SERVICE_RELEASE"
        --build-arg GIT_SHA="$CI_COMMIT_SHA"
        --tag "$IMAGE_NAME:$SERVICE_RELEASE"
        --tag "$IMAGE_NAME:$CI_COMMIT_SHA" .
    - docker push "$IMAGE_NAME:$SERVICE_RELEASE"
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"
    - REPO_DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$SERVICE_RELEASE")
    - echo "IMAGE_DIGEST=${REPO_DIGEST#*@}" | tee release.env
    - echo "SERVICE_RELEASE=$SERVICE_RELEASE" | tee -a release.env
  artifacts:
    reports:
      dotenv: release.env
